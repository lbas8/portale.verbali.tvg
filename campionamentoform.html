<script>
    // Configurazione Firebase (Stesso database del portale)
    const firebaseConfig = {
      databaseURL: "https://vstvg-1f2f6-default-rtdb.europe-west1.firebasedatabase.app"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Generazione righe 1-10 per tabella campioni e analisi
    document.addEventListener("DOMContentLoaded", () => {
      const now = new Date();
      now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
      document.getElementById('datetime').value = now.toISOString().slice(0,16);

      const rowsCamps = document.getElementById('rows-campionamento');
      const rowsAnals = document.getElementById('rows-analisi');

      for (let i = 1; i <= 10; i++) {
        const idStr = i < 10 ? `0${i}` : `${i}`;
        
        // Tabella A con menu a tendina integrati in ogni riga
        rowsCamps.innerHTML += `
          <tr>
            <td class="p-2 border-r text-center font-bold bg-slate-50">${idStr}</td>
            
            <!-- Tipologia (*) -->
            <td class="p-2 border-r">
              <select id="c_${i}_tipologia" class="w-full border rounded p-1 bg-white text-[10px]">
                <option value="">-- Seleziona --</option>
                <option value="TBM nastro">TBM nastro</option>
                <option value="Fronte di scavo">Fronte di scavo</option>
                <option value="Cumulo di stoccaggio">Cumulo di stoccaggio</option>
                <option value="Vasca di stoccaggio">Vasca di stoccaggio</option>
                <option value="Trincea o scavo">Trincea o scavo</option>
                <option value="Sondaggio a carotaggio">Sondaggio a carotaggio</option>
                <option value="Perforazione a distruzione">Perforazione a distruzione</option>
                <option value="Topsoil">Topsoil</option>
                <option value="Affioramento superficiale">Affioramento superficiale</option>
              </select>
            </td>

            <td class="p-2 border-r"><input type="text" id="c_${i}_wbs" class="w-full border rounded p-1 bg-white" placeholder="WBS / Pk"></td>
            <td class="p-2 border-r"><input type="text" id="c_${i}_codice" class="w-full border rounded p-1 bg-white font-bold" placeholder="Etichetta"></td>
            <td class="p-2 border-r"><input type="text" id="c_${i}_prof" class="w-full border rounded p-1 bg-white" placeholder="Profondità"></td>
            
            <!-- Natura (**) e Stato -->
            <td class="p-2 border-r">
              <div class="flex gap-1">
                <select id="c_${i}_natura" class="w-1/2 border rounded p-1 bg-white text-[10px]">
                  <option value="">Nat.</option>
                  <option value="TER">TER</option>
                  <option value="RIP">RIP</option>
                  <option value="RIF">RIF</option>
                </select>
                <select id="c_${i}_stato" class="w-1/2 border rounded p-1 bg-white text-[10px]">
                  <option value="">Stato</option>
                  <option value="Solido">Solido</option>
                  <option value="Polverulento">Polv.</option>
                  <option value="Fangoso">Fang.</option>
                  <option value="Liquido">Liq.</option>
                </select>
              </div>
            </td>

            <!-- Metodo (***) -->
            <td class="p-2 border-r">
              <div class="flex gap-1">
                <select id="c_${i}_metodo_tipo" class="w-1/2 border rounded p-1 bg-white text-[10px]">
                  <option value="">Tipo</option>
                  <option value="Grezzo">Grezzo</option>
                  <option value="Composito">Composito</option>
                  <option value="Puntuale">Puntuale</option>
                  <option value="Talquale">Talquale</option>
                </select>
                <select id="c_${i}_metodo_norma" class="w-1/2 border rounded p-1 bg-white text-[10px]">
                  <option value="">Norma</option>
                  <option value="Casuale">Casuale</option>
                  <option value="Stratificata">Strat.</option>
                  <option value="Sistematica">Sistem.</option>
                  <option value="Dinamica">Dinam.</option>
                  <option value="Selettiva">Selett.</option>
                </select>
              </div>
            </td>

            <td class="p-2 border-r text-center"><input type="text" id="c_${i}_incr" class="w-full border rounded p-1 text-center bg-white" value="1"></td>
            
            <!-- Contenitore (****) -->
            <td class="p-2 border-r">
              <select id="c_${i}_contenitore" class="w-full border rounded p-1 bg-white text-[10px]">
                <option value="">-- Cont. --</option>
                <option value="(1) Busta in plastica">(1) Busta PE</option>
                <option value="(2) Barattolo in PE">(2) Barattolo PE</option>
                <option value="(3) Bottiglia in vetro">(3) Bottiglia vetro</option>
                <option value="(4) Vials">(4) Vials</option>
                <option value="(5) Bottiglia in PE">(5) Bottiglia PE</option>
              </select>
            </td>

            <td class="p-2 text-center"><input type="text" id="c_${i}_repl" class="w-full border rounded p-1 text-center bg-white" value="1"></td>
          </tr>
        `;

        // Tabella B (Analisi)
        rowsAnals.innerHTML += `
          <tr>
            <td class="p-2 border-r text-center font-bold bg-slate-50">${idStr}</td>
            <td class="p-2 border-r text-center"><input type="checkbox" id="b_${i}_amianto" class="w-4 h-4 accent-emerald-600"></td>
            <td class="p-2 border-r text-center"><input type="checkbox" id="b_${i}_dm161_rid" class="w-4 h-4 accent-emerald-600"></td>
            <td class="p-2 border-r text-center"><input type="checkbox" id="b_${i}_dm161_com" class="w-4 h-4 accent-emerald-600"></td>
            <td class="p-2 border-r text-center"><input type="checkbox" id="b_${i}_dlgs152_terre" class="w-4 h-4 accent-emerald-600"></td>
            <td class="p-2 border-r text-center"><input type="checkbox" id="b_${i}_cess_rec" class="w-4 h-4 accent-emerald-600"></td>
            <td class="p-2 border-r text-center"><input type="checkbox" id="b_${i}_cess_disc" class="w-4 h-4 accent-emerald-600"></td>
            <td class="p-2 text-center"><input type="checkbox" id="b_${i}_peric" class="w-4 h-4 accent-emerald-600"></td>
          </tr>
        `;
      }

      // Controllo se stiamo caricando un elemento esistente dall'URL
      const urlParams = new URLSearchParams(window.location.search);
      const loadKey = urlParams.get('load');
      if (loadKey) {
        setTimeout(() => loadFromCloud(loadKey), 400);
      }
    });

    // Salvataggio nel Cloud di tutte le 10 righe e delle analisi
    function saveCampionamentoToCloud() {
      const identificativo = document.getElementById('identificativo').value.trim() || "Campionamento_" + Date.now();
      const cantiere = document.getElementById('localita').value.trim() || "Localita_N.D.";

      const campioniData = {};
      const analisiData = {};

      for (let i = 1; i <= 10; i++) {
        // Raccoglie i dati della Tabella A per ogni riga
        campioniData[i] = {
          tipologia: document.getElementById(`c_${i}_tipologia`).value,
          wbs: document.getElementById(`c_${i}_wbs`).value,
          codice: document.getElementById(`c_${i}_codice`).value,
          prof: document.getElementById(`c_${i}_prof`).value,
          natura: document.getElementById(`c_${i}_natura`).value,
          stato: document.getElementById(`c_${i}_stato`).value,
          metodo_tipo: document.getElementById(`c_${i}_metodo_tipo`).value,
          metodo_norma: document.getElementById(`c_${i}_metodo_norma`).value,
          incr: document.getElementById(`c_${i}_incr`).value,
          contenitore: document.getElementById(`c_${i}_contenitore`).value,
          repl: document.getElementById(`c_${i}_repl`).value
        };

        // Raccoglie i dati delle checkbox della Tabella B per ogni riga
        analisiData[i] = {
          amianto: document.getElementById(`b_${i}_amianto`).checked,
          dm161_rid: document.getElementById(`b_${i}_dm161_rid`).checked,
          dm161_com: document.getElementById(`b_${i}_dm161_com`).checked,
          dlgs152_terre: document.getElementById(`b_${i}_dlgs152_terre`).checked,
          cess_rec: document.getElementById(`b_${i}_cess_rec`).checked,
          cess_disc: document.getElementById(`b_${i}_cess_disc`).checked,
          peric: document.getElementById(`b_${i}_peric`).checked
        };
      }

      const formData = {
        identificativo: identificativo,
        cantiere: cantiere,
        laboratorio: document.getElementById('laboratorio').value,
        esecutore: document.getElementById('esecutore').value,
        datetime: document.getElementById('datetime').value,
        per_conto: document.getElementById('per_conto').value,
        note_campo: document.getElementById('note_campo').value,
        altre_analisi: document.getElementById('altre_analisi').value,
        campioni: campioniData,
        analisi: analisiData,
        timestamp: Date.now()
      };

      db.ref('campionamenti/' + identificativo.replace(/[.#$/[\]]/g, "_")).set(formData, (error) => {
        if (error) {
          alert("Errore salvataggio: " + error.message);
        } else {
          alert("☁️ Campionamento salvato con successo nel Cloud!");
          window.location.href = "campionamenti.html";
        }
      });
    }

    // Caricamento dati da Cloud per tutte le righe
    function loadFromCloud(key) {
      db.ref('campionamenti/' + key).once('value', (snapshot) => {
        const record = snapshot.val();
        if (record) {
          if (record.identificativo) document.getElementById('identificativo').value = record.identificativo;
          if (record.cantiere) document.getElementById('localita').value = record.cantiere;
          if (record.laboratorio) document.getElementById('laboratorio').value = record.laboratorio;
          if (record.esecutore) document.getElementById('esecutore').value = record.esecutore;
          if (record.datetime) document.getElementById('datetime').value = record.datetime;
          if (record.per_conto) document.getElementById('per_conto').value = record.per_conto;
          if (record.note_campo) document.getElementById('note_campo').value = record.note_campo;
          if (record.altre_analisi) document.getElementById('altre_analisi').value = record.altre_analisi;

          // Ripristina i dati delle 10 righe di campionamento
          if (record.campioni) {
            for (let i = 1; i <= 10; i++) {
              const c = record.campioni[i];
              if (c) {
                if (c.tipologia) document.getElementById(`c_${i}_tipologia`).value = c.tipologia;
                if (c.wbs) document.getElementById(`c_${i}_wbs`).value = c.wbs;
                if (c.codice) document.getElementById(`c_${i}_codice`).value = c.codice;
                if (c.prof) document.getElementById(`c_${i}_prof`).value = c.prof;
                if (c.natura) document.getElementById(`c_${i}_natura`).value = c.natura;
                if (c.stato) document.getElementById(`c_${i}_stato`).value = c.stato;
                if (c.metodo_tipo) document.getElementById(`c_${i}_metodo_tipo`).value = c.metodo_tipo;
                if (c.metodo_norma) document.getElementById(`c_${i}_metodo_norma`).value = c.metodo_norma;
                if (c.incr) document.getElementById(`c_${i}_incr`).value = c.incr;
                if (c.contenitore) document.getElementById(`c_${i}_contenitore`).value = c.contenitore;
                if (c.repl) document.getElementById(`c_${i}_repl`).value = c.repl;
              }
            }
          }

          // Ripristina i dati delle checkbox di analisi
          if (record.analisi) {
            for (let i = 1; i <= 10; i++) {
              const a = record.analisi[i];
              if (a) {
                if (a.amianto !== undefined) document.getElementById(`b_${i}_amianto`).checked = a.amianto;
                if (a.dm161_rid !== undefined) document.getElementById(`b_${i}_dm161_rid`).checked = a.dm161_rid;
                if (a.dm161_com !== undefined) document.getElementById(`b_${i}_dm161_com`).checked = a.dm161_com;
                if (a.dlgs152_terre !== undefined) document.getElementById(`b_${i}_dlgs152_terre`).checked = a.dlgs152_terre;
                if (a.cess_rec !== undefined) document.getElementById(`b_${i}_cess_rec`).checked = a.cess_rec;
                if (a.cess_disc !== undefined) document.getElementById(`b_${i}_cess_disc`).checked = a.cess_disc;
                if (a.peric !== undefined) document.getElementById(`b_${i}_peric`).checked = a.peric;
              }
            }
          }
        }
      });
    }

    // Funzione invio e-mail tramite client di posta predefinito
    function sendEmailReport() {
      const dest = document.getElementById('email_destinatari').value;
      const cc = document.getElementById('email_cc').value;
      const id = document.getElementById('identificativo').value || "CDC-N.D.";
      const localita = document.getElementById('localita').value || "N.D.";

      const subject = encodeURIComponent(`Catena di Custodia - ${id} - ${localita}`);
      const body = encodeURIComponent(`Buongiorno,\n\nSi trasmette in allegato / si anticipa la Catena di Custodia n. ${id} relativa al cantiere: ${localita}.\n\nCordiali saluti.`);

      window.location.href = `mailto:${dest}?cc=${cc}&subject=${subject}&body=${body}`;
    }
  </script>
