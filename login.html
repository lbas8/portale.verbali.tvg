<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accesso Portale Ambientale - Terzo Valico AV/AC</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-800 font-sans min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-2xl border border-slate-700 max-w-md w-full p-8 space-y-6">
    <!-- LOGO E INTESTAZIONE -->
    <div class="text-center space-y-2">
      <div class="inline-flex items-center justify-center w-16 h-16 bg-slate-100 rounded-full border border-slate-300 mb-2">
        <i class="fa-solid fa-shield-halved text-emerald-600 text-2xl"></i>
      </div>
      <h1 class="text-xl font-bold text-slate-900 uppercase">Portale Ambientale</h1>
      <p class="text-xs text-slate-500 font-medium">Terzo Valico dei Giovi — COCIV / Webuild</p>
    </div>

    <!-- FORM DI LOGIN -->
    <form onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Password / PIN Aziendale</label>
        <div class="relative">
          <input type="password" id="password_input" required placeholder="Inserisci la password..." 
                 class="w-full border border-slate-300 rounded-lg px-3 py-2.5 pl-10 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
          <i class="fa-solid fa-key text-slate-400 absolute left-3 top-3.5 text-xs"></i>
        </div>
      </div>

      <div id="error_msg" class="hidden text-xs text-red-600 bg-red-50 border border-red-200 p-2.5 rounded-lg text-center font-medium">
        <i class="fa-solid fa-circle-exclamation mr-1"></i> Password errata. Riprova.
      </div>

      <button type="submit" class="w-full bg-emerald-700 hover:bg-emerald-600 text-white font-bold py-2.5 px-4 rounded-lg shadow-md transition text-sm flex items-center justify-center gap-2">
        <i class="fa-solid fa-right-to-bracket"></i> Accedi al Portale
      </button>
    </form>

    <div class="text-center border-t border-slate-200 pt-4 text-[10px] text-slate-400">
      Accesso riservato al personale autorizzato COCIV / Subappaltatori.
    </div>
  </div>

  <script>
    // Configura qui la password di accesso al portale
    const PORTAL_PASSWORD = "COCIV2026!"; 

    // Se l'utente è già autenticato, reindirizza subito alla home
    if (sessionStorage.getItem('cociv_authenticated') === 'true') {
      window.location.href = 'index.html';
    }

    function handleLogin(event) {
      event.preventDefault();
      const inputPass = document.getElementById('password_input').value;
      const errorMsg = document.getElementById('error_msg');

      if (inputPass === PORTAL_PASSWORD) {
        // Salva la sessione nel browser
        sessionStorage.setItem('cociv_authenticated', 'true');
        window.location.href = 'index.html';
      } else {
        errorMsg.classList.remove('hidden');
        document.getElementById('password_input').value = '';
      }
    }
  </script>
</body>
</html>
